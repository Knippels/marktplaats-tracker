# Marktplaats-tracker configuratie
#
# Elke categorie wordt een eigen tab op de pagina, met eigen prijshistorie
# en eigen "interessante aanbiedingen".
#
# Nieuwe zoekterm toevoegen = nieuw blok onder `categories:` kopiëren en aanpassen.
#
# Velden per categorie:
#   nas_score       (optioneel) true = score 0-10 en OMV-kolom op basis van scraper/nas_models.yml
#   kind            hdd (schijven) of enclosure (DAS/NAS) — bepaalt welke kolommen de tabel toont
#   id              unieke korte naam (alleen a-z, 0-9 en -), wordt de bestandsnaam
#   name            naam op de pagina
#   queries         één of meer zoekopdrachten op Marktplaats (resultaten worden samengevoegd)
#   include         (optioneel) regex: titel+omschrijving MOET hierop matchen
#   exclude         (optioneel) regex: advertentie wordt overgeslagen als dit matcht
#   min_price/max_price  (optioneel) in euro's; buiten dit bereik wordt genegeerd
#   min_tb          (optioneel) minimale capaciteit in TB (gelezen uit de titel)
#   metric          "price" (standaard) of "price_per_tb" — waarop grafiek en deals gebaseerd zijn
#   deal_max        (optioneel) vaste grens: alles op of onder deze waarde (in de metric) is "interessant"
#   deal_percentile (optioneel, standaard 25) als deal_max ontbreekt: goedkoopste X% van actieve advertenties
#
# Regexen zijn hoofdletterongevoelig en worden toegepast op titel + omschrijving.

# Optioneel: alleen zoeken binnen een straal rond een postcode
# postcode: "2181AA"
# distance_km: 50

categories:
  - id: hdd-sata-4tb-plus
    name: "SATA HDD 4TB+"
    kind: hdd          # tabel: merk, type, grootte, aantal, prijs per stuk
    queries:
      - "hdd 4tb"
      - "hdd 6tb"
      - "hdd 8tb"
      - "hdd 10tb"
      - "hdd 12tb"
      - "hdd 14tb"
      - "hdd 16tb"
      - "hdd 18tb"
      - "hdd 20tb"
      - "wd red"
      - "seagate ironwolf"
      - "seagate exos"
      - "wd ultrastar"
    include: '\b\d{1,2}\s?(tb|tib|terabyte)\b'
    # uitgesloten: SSD/2,5", extern/USB, SAS (niet SATA), defect/SMART-fouten, complete NAS'en, recorders
    exclude: '\b(ssd|nvme|m\.2|2[.,]5\s?(inch|"|'')|laptop|extern\w*|external|usb|portable|expansion|elements|my\s?book|lacie|g-drive|sas\d?|defect\w*|kapot|smart[\s-]?(fout\w*|error\w*|warning)|warning|waarschuw\w*|slecht|gezocht|ps4|ps5|xbox|playstation|recorder|\d*[\s-]?kanaals?|nas\s?(server|systeem|behuizing)|synology|qnap|ds\d{3,4}|\b2[.,]5\b|icy\s?dock|gen\d+|proliant|poweredge|microserver|[md]l\d{3}|server\s?-\s?\d+gb)\b'
    min_tb: 4
    min_price: 10
    max_price: 600
    metric: price_per_tb
    deal_max: 12   # €/TB

  - id: das-4-bay
    name: "4-bay DAS"
    kind: enclosure    # tabel: merk, type, bays, aansluitingen, meegeleverde opslag
    # Zoektermen gebaseerd op hoe DAS-behuizingen echt op Marktplaats staan
    # (categorieën Harde schijven, NAS en Dockingstations; titels als "4-bay behuizing",
    # "4HDD behuizing", "4x 3,5\" SATA ... USB3 eSATA", "Disk Enclosure", "Docking Station")
    queries:
      - "4-bay"
      - "4 bay behuizing"
      - "4hdd behuizing"
      - "4x 3,5 behuizing"
      - "das behuizing"
      - "das storage"
      - "disk enclosure"
      - "harde schijf behuizing"
      - "hdd behuizing 3.5"
      - "raid behuizing"
      - "esata behuizing"
      - "hdd docking station"
      - "terramaster"
      - "terramaster d4"
      - "orico"
      - "icy box"
      - "mediasonic"
      - "yottamaster"
      - "sabrent"
      - "qnap tr-004"
      - "fantec"
      - "raidsonic"
    include: '(\b4[\s-]?(bay|bays|slots?|sleuven|voudig|hdd|disks?|drives?|schijven)\b|\b4\s?x\s?3[.,]5|\bd4-?\d{3}|tr-?004)'
    # uitgesloten: complete NAS'en (merken/modellen), servers/chassis, 2,5"-only, NVMe-hybride, niet-IT
    exclude: '\b(gezocht|synology|diskstation|rackstation|ds\d{3}(?!\d)\w*|rx\d{3}\w*|ts-?\d{3}\w*|tl-d\d+\w*|readynas|rn\d{3,4}\w*|netgear|zyxel|thecus|asustor\s?as|as-?\d{3,4}\w*|f\d-\d{3}\w*|d[1235]-\d{3}\w*|[1235678][\s-]?bays?|business\s?storage|network|netwerk\w*|gigabit|dsm|expansion\s?(module|box|unit)|nas\s?(chassis|server|systeem)|chassis|moederbord|mediastation|rack\w*|server\w*|1u|2u|nvme|m\.2|voor\s2[.,]5\s?(inch|"|'')|2[.,]5\s?(inch|"|'')\s?only|hopper|sterilisator)\b'
    min_price: 20
    max_price: 400
    metric: price
    deal_percentile: 25

  - id: nas-4-bay
    name: "4-bay NAS"
    kind: enclosure    # tabel: merk, type, bays, aansluitingen, meegeleverde opslag
    nas_score: true    # bruikbaarheidsscore + OMV-kolom (modellen in scraper/nas_models.yml)
    # Complete NAS'en met 4 schijfsloten (met of zonder schijven). Prijs is inclusief eventuele schijven.
    queries:
      - "4-bay nas"
      - "4 bay nas"
      - "nas 4x"
      - "qnap ts-4"
      - "qnap ts"
      - "synology ds4"
      - "synology ds9"
      - "synology 4 bay"
      - "terramaster f4"
      - "asustor 4 bay"
      - "readynas"
    # 4-bay in titel/omschrijving, of een bekend 4-bay-model
    include: '(\b4[\s-]?(bay|bays|slots?|sleuven|disks?|drives?|schijven)\b|\b4\s?x\s?\d{1,2}\s?tb\b|\bts-?4\d{2}\w*|\bds4\d{2}\w*|\bds9\d{2}\w*|\bf4-\d{3}\w*|\bas\d?4\d{2}\w*|\brn\d?[13]?\d?4\b|\brn[123]4\d{2}\w*|\bix4\b)'
    exclude: '\b(gezocht|defect\w*|kapot|reparatie|onderdelen|[1235678][\s-]?bays?|1u|2u|rack\w*|rackstation|rs\d{3,4}\w*|rx\d{3}\w*|\w+-rp\+?|ts-?\d{3,4}(u|xu|pxu)\w*|expansion|jbod|netapp|chassis|moederbord|d[1235]-\d{3}\w*|ram\s?modules?|lade|tray|caddy|beugel|das|docking\w*|dock|behuizing|enclosure|kast|esata|usb[\s-]?c|thunderbolt|nvme|lacie|voor\s2[.,]5|sterilisator|uv\w*|hopper)\b'
    min_price: 30
    max_price: 900
    metric: price
    deal_percentile: 25
