<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Homelab Deal Tracker</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
  <header class="top">
    <div class="wrap">
      <div class="brand">
        <h1>Homelab Deal Tracker</h1>
        <p class="sub" id="updated">Laden…</p>
      </div>
      <nav class="tabs" id="tabs" role="tablist"></nav>
    </div>
  </header>

  <main class="wrap" id="main">
    <p class="muted">Gegevens laden…</p>
  </main>

  <footer class="wrap foot">
    <p>Bron: Marktplaats.nl · wordt elke 3 uur bijgewerkt via GitHub Actions ·
      zoektermen aanpassen in <code>config.yml</code></p>
  </footer>

  <template id="cat-tpl">
    <section class="block table-block">
      <div class="block-head">
        <h2>Advertenties</h2>
        <div class="controls">
          <div class="chips" role="group" aria-label="Snelfilter">
            <button type="button" class="chip" data-only="all" aria-pressed="true">Alle</button>
            <button type="button" class="chip deal" data-only="deal" aria-pressed="false">Deals <span class="n-deal"></span></button>
            <button type="button" class="chip new" data-only="new" aria-pressed="false">Nieuw <span class="n-new"></span></button>
          </div>
          <input type="search" class="filter" placeholder="Filter op titel, merk, type, plaats…" aria-label="Filter">
          <label class="check"><input type="checkbox" class="hide-reserved"> gereserveerd verbergen <span class="n-res muted"></span></label>
          <label class="check"><input type="checkbox" class="show-gone"> verdwenen tonen</label>
        </div>
      </div>
      <p class="legend">
        <span><i class="sw sw-deal"></i>deal</span>
        <span><i class="sw sw-new"></i><span class="new-h">nieuw</span></span>
        <span><span class="dot"></span>sinds je laatste bezoek</span>
        <span class="hdd-only">≈ = prijs per stuk geschat</span>
        <span class="nas-only">score 0–10: platform, CPU, RAM, OS-updates (hover voor uitleg) · OMV ✓ ja, ~ met omweg, ✗ nee</span>
        <span class="deal-rule"></span>
      </p>
      <div class="table-wrap">
        <table class="list">
          <thead><tr></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <section class="kpis"></section>

    <section class="block">
      <div class="block-head">
        <h2>Prijsverloop</h2>
        <span class="hint chart-hint"></span>
      </div>
      <div class="chart-box"><canvas></canvas></div>
      <p class="muted chart-empty" hidden>Nog niet genoeg historie — na een paar dagen verschijnt hier de grafiek.</p>
    </section>

    <section class="block">
      <div class="block-head">
        <h2>Interessante aanbiedingen</h2>
      </div>
      <div class="cards deals"></div>
    </section>

    <section class="block">
      <div class="block-head">
        <h2>Nieuw binnen</h2>
        <span class="hint new-hint"></span>
      </div>
      <div class="cards new"></div>
    </section>
  </template>

  <script src="app.js"></script>
</body>
</html>
