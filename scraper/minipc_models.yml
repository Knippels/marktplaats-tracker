# Gangbare zakelijke mini-pc's (1-liter "TinyMiniMicro") en hun platform.
#
# Velden:
#   pattern     regex op titel + omschrijving (hoofdletterongevoelig)
#   brand       merk
#   gen         Intel Core-generatie (of "ryzen2"/"ryzen3"/"ryzen4" voor AMD) die meestal in dit model zit;
#               gebruikt als de processor niet in de advertentie staat
#   cpu         meest voorkomende processor (aanname als niets vermeld is)
#   ram_max     maximaal geheugen (GB). Lenovo/Kingston noemen officieel 32 GB voor de 8e/9e-gen Tiny's;
#               64 GB (2x 32 GB) werkt in de praktijk (ServeTheHome) maar staat hier niet.
#   nvme        aantal M.2 NVMe-sloten voor opslag
#   bay25       2,5"-SATA-bay aanwezig (true/false)
#   pcie        PCIe-uitbreidingsslot (bijv. extra netwerkkaart) aanwezig
#   gen_by_suffix (optioneel) "Gen 2" in de naam -> andere CPU-generatie
#   src         v = gecontroleerd (Kingston / ServeTheHome), k = fabrikantgegevens, niet los gecontroleerd

