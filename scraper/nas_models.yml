# Specificaties van gangbare 4-bay NAS'en, gebruikt voor de bruikbaarheidsscore en de OMV-kolom.
#
# Velden:
#   cpu        processor (zoals de fabrikant hem noemt)
#   arch       x86_64 | x86_32 | arm64 | armv7 | armv5 | ppc
#   cores      aantal kernen
#   tier       grove prestatieklasse 1 (zeer traag) .. 5 (snel), zie README
#   ram        standaard geheugen in GB (laagste variant)
#   ram_max    maximaal geheugen in GB volgens fabrikant
#   video      hdmi | vga | none   (scherm nodig om een ander OS te installeren)
#   os         actief | beperkt | eol
#              actief  = krijgt nog volledige updates van huidige DSM/QTS (model 2020 of later)
#              beperkt = draait nog DSM 7 / QTS 5, maar ouder model (einde ondersteuning nadert)
#              eol     = blijft hangen op DSM 6.2 (EOL sinds 1-10-2024) of QTS 4.x
#   omv        ja | omweg | nee    (OpenMediaVault 7/8 installeerbaar)
#   net        snelste ingebouwde netwerk (1, 2.5, 10 GbE)
#   m2         M.2/NVMe-sloten aanwezig (true/false)
#   src        v = specs gecontroleerd op fabriekspagina; k = uit fabrikantspecs/kennis, niet los gecontroleerd
#
# Bronnen: QNAP productpagina's (qnap.com/en/product/<model>/specs/hardware), QTS 5.0.1 release notes
# (lijst "Applicable Models"), SynoCommunity "Architecture per Synology model", mariushosting DSM 7.0
# supported devices, blackvoid DSM 6.2 EOL, openmediavault prerequisites, CNX Software (OMV 8 alleen 64-bit).

